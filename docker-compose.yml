services:
  postgres:
    image: postgres:17
    container_name: jobboost-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobboost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-jobboost}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:24-bookworm
    container_name: jobboost-api
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "apt-get update &&
      apt-get install -y --no-install-recommends chromium fonts-liberation &&
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --dir apps/api start:dev"
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      PORT: "8080"
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobboost}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jobboost}?schema=public
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      API_URL: http://127.0.0.1:8080
      JOBBOOST_API_URL: http://127.0.0.1:8080
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium
      PUPPETEER_SKIP_DOWNLOAD: "true"
    volumes:
      - ./:/app
      - api_node_modules:/app/node_modules
      - api_app_node_modules:/app/apps/api/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
  web:
    image: node:24-bookworm
    container_name: jobboost-web
    restart: unless-stopped
    working_dir: /app
    command: >
      sh -c "corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --dir apps/web dev --hostname 0.0.0.0"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:8080
      INTERNAL_API_URL: http://api:8080
      WATCHPACK_POLLING: "true"
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
      - web_app_node_modules:/app/apps/web/node_modules
      - web_next:/app/apps/web/.next
    depends_on:
      - api

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.41.5
    container_name: jobboost-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: Europe/Paris
      GENERIC_TIMEZONE: Europe/Paris
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      FT_CLIENT_ID: ${FT_CLIENT_ID}
      FT_CLIENT_SECRET: ${FT_CLIENT_SECRET}
      JOBBOOST_API_URL: http://api:8080
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - api

volumes:
  postgres_data:
  n8n_data:
  api_node_modules:
  api_app_node_modules:
  web_node_modules:
  web_app_node_modules:
  web_next: